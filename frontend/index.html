<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Chain KI Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 h-screen flex flex-col font-sans">

    <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fas fa-robot mr-2"></i> Document & Data Agent</h1>
        <span class="bg-blue-700 px-3 py-1 rounded-full text-sm">Status: Online</span>
    </header>

    <main class="flex-grow flex p-6 gap-6 max-w-7xl mx-auto w-full">
        
        <div class="w-1/3 bg-white rounded-xl shadow-sm p-6 flex flex-col border border-slate-200">
            <h2 class="text-lg font-semibold mb-4 text-slate-800"><i class="fas fa-file-pdf mr-2 text-red-500"></i> Dokumenten-Upload</h2>
            
            <div class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors cursor-pointer" id="dropzone">
                <input type="file" id="fileInput" class="hidden" accept=".pdf">
                <i class="fas fa-cloud-upload-alt text-4xl text-slate-400 mb-3"></i>
                <p class="text-slate-600 font-medium">PDF hier ablegen oder klicken</p>
            </div>
            
            <div id="uploadStatus" class="mt-4 text-sm text-center font-medium hidden"></div>
            <p id="uploadedFileName" class="mt-2 text-xs text-slate-500 text-center font-mono"></p>
        </div>

        <div class="w-2/3 bg-white rounded-xl shadow-sm flex flex-col border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 p-4 border-b border-slate-200">
                <h2 class="text-lg font-semibold text-slate-800"><i class="fas fa-comment-dots mr-2 text-blue-500"></i> Agenten-Kommunikation</h2>
            </div>
            
            <div id="chatBox" class="flex-grow p-4 overflow-y-auto flex flex-col gap-4 bg-slate-50">
                <div class="flex gap-3">
                    <div class="bg-blue-100 p-3 rounded-lg rounded-tl-none max-w-[80%] text-slate-800 shadow-sm border border-blue-200">
                        Hallo! Ich bin dein KI-Agent. Lade ein Dokument hoch und sage mir, was ich analysieren, prüfen oder markieren soll.
                    </div>
                </div>
            </div>

            <div class="p-4 bg-white border-t border-slate-200 flex gap-2">
                <input type="text" id="promptInput" placeholder="Z.B. 'Lies das PDF und markiere alle Geldeingänge über 200 Euro...'" 
                       class="flex-grow px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors shadow-sm">
                    Senden <i class="fas fa-paper-plane ml-1"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        // Logik für Datei-Upload
        const threadId = "session_" + Date.now();

        const fileInput = document.getElementById('fileInput');
        const dropzone = document.getElementById('dropzone');
        const uploadStatus = document.getElementById('uploadStatus');
        const uploadedFileName = document.getElementById('uploadedFileName');
        let currentUploadedFile = "";

        dropzone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            uploadStatus.classList.remove('hidden', 'text-green-600', 'text-red-600');
            uploadStatus.classList.add('text-blue-600');
            uploadStatus.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Lade hoch...';

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                
                uploadStatus.classList.replace('text-blue-600', 'text-green-600');
                uploadStatus.innerHTML = '<i class="fas fa-check-circle"></i> Upload erfolgreich!';
                currentUploadedFile = data.filename;
                uploadedFileName.innerText = `Gespeichert als: storage/${data.filename}`;
            } catch (err) {
                uploadStatus.classList.replace('text-blue-600', 'text-red-600');
                uploadStatus.innerText = 'Fehler beim Upload.';
            }
        });

        // Logik für den Chat
        const sendBtn = document.getElementById('sendBtn');
        const promptInput = document.getElementById('promptInput');
        const chatBox = document.getElementById('chatBox');

        function addMessage(text, isUser) {
            // Erkennt Links in der KI-Antwort und macht sie klickbar
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const formattedText = text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" class="text-blue-700 underline font-bold"><i class="fas fa-download"></i> Datei herunterladen</a>`;
            }).replace(/\n/g, '<br>');

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-3 ${isUser ? 'justify-end' : 'justify-start'}`;
            msgDiv.innerHTML = `
                <div class="${isUser ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white text-slate-800 rounded-tl-none border border-slate-200'} p-3 rounded-lg max-w-[80%] shadow-sm">
                    ${formattedText}
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

sendBtn.addEventListener('click', async () => {
            const frage = promptInput.value.trim();
            if (!frage) return;

            // 1. Dem User zeigen wir nur seine normale Frage an
            addMessage(frage, true);
            promptInput.value = '';
            
            let backendPrompt = frage;
            if (currentUploadedFile !== "") {
                backendPrompt = `[Kontext: Der User bezieht sich auf die Datei 'storage/${currentUploadedFile}']. ` + frage;
            }
            
            // Lade-Indikator
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = 'flex gap-3 justify-start';
            loadingDiv.innerHTML = `<div class="bg-slate-100 text-slate-500 p-3 rounded-lg rounded-tl-none border border-slate-200 shadow-sm"><i class="fas fa-cog fa-spin mr-2"></i> Agent analysiert und handelt...</div>`;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                
                const response = await fetch(`/ask?frage=${encodeURIComponent(backendPrompt)}&thread_id=${threadId}`);

                const data = await response.json();
                document.getElementById(loadingId).remove();
                addMessage(data.ki_antwort, false);
            } catch (err) {
                document.getElementById(loadingId).remove();
                addMessage("Systemfehler bei der Kommunikation mit dem Agenten.", false);
            }
        });

        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
